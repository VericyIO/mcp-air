# Thalus AIR MCP - mcp.air.thalus.ai
# Place in: /etc/angie/http.d/mcp-air.conf
# Deploy on the dedicated MCP server (not the main AIR API host).

server {
    listen 80;
    server_name mcp.air.thalus.ai;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.air.thalus.ai;

    acme letsencrypt_prod;

    ssl_certificate $acme_cert_letsencrypt_prod;
    ssl_certificate_key $acme_cert_key_letsencrypt_prod;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Streamable HTTP MCP can hold long-lived assessment polls.
    location / {
        proxy_pass http://127.0.0.1:4104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 75s;
    }
}
