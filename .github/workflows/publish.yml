name: Publish

on:
  push:
    tags:
      - 'mcp-air-v*'

concurrency:
  group: publish-mcp-air-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish @thalus-ai/mcp-air
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build and verify bundle
        run: pnpm prepublishOnly

      - name: MCP protocol smoke test
        run: pnpm test -- test/server.test.ts

      - name: Pack for npm
        run: npm pack

      - name: Publish to npm
        run: npm publish thalus-ai-mcp-air-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
